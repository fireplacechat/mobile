name: Bug report
description: Something does not work in the app.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please search existing issues first. **Never include message text, passwords, recovery keys, QR codes or other people's details.**
        Security problems: do not post them here; follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / build
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: For example "iPhone 15, iOS 26.1" or "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots are welcome (hide names and messages).
