name: Feature request
description: Suggest an improvement to the app.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please search existing issues and discussions first. Fireplace is built to collect as little as possible,
        so by design it has no typing indicators, read receipts, online status, analytics or tracking. Ideas that need
        any of those will not be accepted. Questions and early ideas are welcome in [Discussions](https://github.com/fireplacechat/mobile/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea works without sending message text, contact lists or usage data to any server.
          required: true
