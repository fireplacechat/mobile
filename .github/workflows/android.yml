# Release-APK build and permission check (Linux, ~9 minutes). Only when something that can break it changes.
name: Android build
on:
  push:
    branches: [main]
    paths: ['android/**', 'pubspec.yaml', 'pubspec.lock', 'scripts/check_apk.sh', 'scripts/test_check_apk.sh', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: pubspec.yaml, cache: true }
      - run: flutter pub get
      # No signing key in CI: the build falls back to the debug key, which proves it builds
      # and lets us check the manifest. Never distribute this artifact.
      - run: flutter build apk --release --target-platform android-arm64
      - run: scripts/check_apk.sh build/app/outputs/flutter-apk/app-release.apk
      # The checker's signer rules (debug key, wrong key, tampered APK, no fingerprint) are tested on re-signed copies.
      - run: scripts/test_check_apk.sh build/app/outputs/flutter-apk/app-release.apk
