name: iOS signing setup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: ios-release
jobs:
  signing:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository only allows GitHub-owned actions and the pinned Flutter action, so no Ruby
      # setup action: the macOS runner already ships Ruby and Bundler; fastlane comes from ios/Gemfile.lock.
      - name: Install fastlane from the lockfile
        working-directory: ios
        run: |
          set -euo pipefail
          ruby --version
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Mask credentials and prepare temporary API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID MATCH_PASSWORD MATCH_GIT_URL MATCH_GIT_BASIC_AUTHORIZATION; do
            value="${!name}"
            [ -n "$value" ] || { echo "Missing environment secret: $name"; exit 1; }
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '::add-mask::%s\n' "$value"
          done
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/fireplace-asc-key.p8"
          chmod 600 "$RUNNER_TEMP/fireplace-asc-key.p8"
          printf 'ASC_KEY_PATH=%s/fireplace-asc-key.p8\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run signing lane
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_CREATE: '1'
        run: bundle exec fastlane signing
      - name: Remove temporary API key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/fireplace-asc-key.p8"
