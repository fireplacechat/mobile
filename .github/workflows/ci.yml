# Public client checks; backend emulator jobs live separately.
#
# Shape: static checks and four test shards run side by side, the tests that
# measure real time run alone, and a final job named `test` collects the results.
# The Rust core is built once per version and restored from the cache after that.
# Tests tagged `nightly` repeat others at more sizes or against the reference
# crypto; they run in nightly.yml, not here.
# `test` is the check branch protection requires, so keep that job id and name.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an unfinished pull-request run; runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TZ: UTC
jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: pubspec.yaml, cache: false }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test scripts packages/fireplace_native/lib
      - run: flutter analyze
      - run: python3 scripts/check_layout.py .
      - run: python3 scripts/test_check_layout.py
      - run: python3 scripts/test_check_ios_preview.py
      - run: python3 scripts/test_check_ios_upgrade.py
      - run: bash scripts/test_build_aab.sh
      - run: python3 scripts/test_check_crypto_apk.py
      - run: node --test .github/scripts/cla-check.test.js
      # Explicit manual runs also produce reviewable UI artifacts. Ordinary
      # pull-request checks keep their existing job shape and render workload.
      - name: Build the host core for manual screen renders
        if: github.event_name == 'workflow_dispatch'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          bash scripts/build_crypto_host.sh
      - name: Render screens for review
        if: github.event_name == 'workflow_dispatch'
        run: flutter test scripts/render/render_screens_test.dart
      - name: Upload fictional screen renders
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fireplace-screen-renders
          path: build/renders/
          if-no-files-found: error
          retention-days: 7

  unit:
    name: unit (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: pubspec.yaml, cache: false }
      - run: flutter pub get
      - name: Restore the built Rust core
        id: core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the two libraries the tests load, not the whole build folder.
          path: |
            build/fireplace_crypto/host/release/libfireplace_crypto.so
            build/fireplace_crypto/host-test-rng/release/libfireplace_crypto_tests.so
          key: crypto-host-${{ runner.os }}-${{ hashFiles('packages/fireplace_native/rust/**', 'scripts/build_crypto_host.sh') }}
      - name: Build the Rust core (only when it changed)
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          bash scripts/build_crypto_host.sh
          bash scripts/build_crypto_host.sh test-rng
      - run: flutter test --exclude-tags timing --exclude-tags nightly --total-shards 4 --shard-index ${{ matrix.shard }}

  timing:
    name: timing tests (one at a time)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: pubspec.yaml, cache: false }
      - run: flutter pub get
      - name: Restore the built Rust core
        id: core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the two libraries the tests load, not the whole build folder.
          path: |
            build/fireplace_crypto/host/release/libfireplace_crypto.so
            build/fireplace_crypto/host-test-rng/release/libfireplace_crypto_tests.so
          key: crypto-host-${{ runner.os }}-${{ hashFiles('packages/fireplace_native/rust/**', 'scripts/build_crypto_host.sh') }}
      - name: Build the Rust core (only when it changed)
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          bash scripts/build_crypto_host.sh
          bash scripts/build_crypto_host.sh test-rng
      - run: scripts/run_timing_tests.sh

  test:
    name: test
    if: ${{ always() }}
    needs: [static, unit, timing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
