# Delete a pull request's Actions caches when it closes, so merged or abandoned
# branches stop consuming the repository's 10 GB Actions cache allowance.
# Uses only the preinstalled gh CLI (no third-party actions) to fit the repo's
# action allowlist.
name: Cleanup PR caches
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
  contents: read
concurrency: cache-cleanup-${{ github.event.pull_request.number }}
jobs:
  cleanup:
    # Skip fork PRs: their token is read-only, and they cannot write base-repo caches.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete caches scoped to this PR's merge ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO/actions/caches?ref=$REF" --jq '.actions_caches[].id')
          if [ -z "$ids" ]; then
            echo "No caches for $REF."
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id" && echo "deleted cache $id"
          done
